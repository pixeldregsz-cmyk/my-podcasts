<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Podcasts</title>
<meta name="theme-color" content="#14100c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Podcasts">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#14100c;--card:#1e1811;--card2:#262019;--ink:#f2e9dc;--dim:#a89880;--amber:#e8a33d;--line:#33291d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:120px}
header{padding:22px 18px 6px;display:flex;align-items:flex-end;justify-content:space-between}
h1{font-size:30px;margin:0;letter-spacing:.2px}
.sub{color:var(--dim);font-size:14px;margin-top:4px}
#addBtn{background:var(--amber);color:#1a1206;border:0;width:46px;height:46px;border-radius:50%;font-size:28px;line-height:1;font-weight:700;flex:0 0 auto}
section{padding:14px 18px 4px}
.showhead{display:flex;gap:14px;align-items:center;margin:16px 0 6px}
.showhead img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--card)}
.showhead h2{font-size:21px;margin:0}
.showhead p{color:var(--dim);font-size:13px;margin:4px 0 0;line-height:1.45}
.ep{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0;color:var(--ink);align-items:center}
.ep:active{background:var(--card2)}
.ep .play{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--amber);color:#1a1206;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700}
.ep.playing{border-color:var(--amber)}
.ep .meta{flex:1;min-width:0}
.ep .lab{color:var(--amber);font-size:12px;font-weight:700;letter-spacing:.6px}
.ep .ttl{font-size:16px;font-weight:600;margin:2px 0}
.ep .dsc{color:var(--dim);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ep .dur{color:var(--dim);font-size:12px;flex:0 0 auto;text-align:right}
.ep .bar{height:3px;background:var(--line);border-radius:2px;margin-top:7px}
.ep .bar i{display:block;height:100%;background:var(--amber);border-radius:2px}
.done{color:var(--amber);font-size:12px;font-weight:700}
#continueWrap{display:none}
#player{position:fixed;left:0;right:0;bottom:0;background:#0d0a07;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;z-index:20}
#player .row{display:flex;align-items:center;gap:12px}
#player img{width:48px;height:48px;border-radius:9px;object-fit:cover;background:var(--card)}
#player .who{flex:1;min-width:0}
#player .who .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .who .s{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbtn{background:none;border:0;color:var(--ink);font-size:21px;padding:8px}
.pbtn.main{background:var(--amber);color:#1a1206;width:52px;height:52px;border-radius:50%;font-size:22px}
#seek{width:100%;margin:10px 0 2px;accent-color:var(--amber);height:28px}
.times{display:flex;justify-content:space-between;color:var(--dim);font-size:12px}
#npDesc{color:var(--dim);font-size:13px;line-height:1.5;margin-top:8px;display:none}
#speedBtn{font-size:14px;font-weight:700;color:var(--amber);min-width:46px}
#addScreen{display:none;padding:18px}
#addScreen h2{margin:6px 0 12px}
#addScreen label{display:block;color:var(--dim);font-size:13px;margin:14px 0 5px}
#addScreen input,#addScreen select,#addScreen textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:12px;font-size:16px}
#addScreen .go{background:var(--amber);color:#1a1206;border:0;border-radius:12px;width:100%;padding:15px;font-size:17px;font-weight:700;margin-top:20px}
#addScreen .back{background:none;border:0;color:var(--amber);font-size:16px;padding:6px 0}
.addedItem{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0;font-size:14px}
.addedItem button{background:none;border:0;color:#e0654a;font-size:15px}
footer{padding:26px 18px 10px;color:var(--dim);font-size:13px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div>
    <h1>My Podcasts</h1>
    <div class="sub">Your shows. Tap one and listen.</div>
  </div>
  <button id="addBtn" title="Add an episode">+</button>
</header>

<section id="continueWrap">
  <div class="showhead"><h2>Continue Listening</h2></div>
  <div id="continueList"></div>
</section>

<main id="shows"></main>

<div id="addScreen">
  <button class="back" id="addBack">← Back to shows</button>
  <h2>Add an Episode</h2>
  <label>Show</label>
  <select id="fShow"></select>
  <div id="newShowWrap" style="display:none">
    <label>New show name</label>
    <input id="fNewShow" type="text" placeholder="Show name">
  </div>
  <label>Episode title</label>
  <input id="fTitle" type="text" placeholder="Episode title">
  <label>Label (optional, like S1E3)</label>
  <input id="fLabel" type="text" placeholder="S1E3">
  <label>Description (optional)</label>
  <textarea id="fDesc" rows="3"></textarea>
  <label>Audio link</label>
  <input id="fUrl" type="url" placeholder="https://…/episode.mp3">
  <button class="go" id="fGo">Add Episode</button>
  <div id="addedWrap" style="margin-top:26px">
    <h2 style="font-size:17px">Added by you</h2>
    <div id="addedList"></div>
  </div>
</div>

<footer>
  To keep this on your Home Screen: open this page in Safari, tap the Share button, then “Add to Home Screen.” It opens like an app from then on — no sign-in, ever.
</footer>

<div id="player">
  <div class="row">
    <img id="pCover" alt="">
    <div class="who"><div class="t" id="pTitle">—</div><div class="s" id="pShow">—</div></div>
    <button class="pbtn" id="prevBtn">⏮</button>
    <button class="pbtn main" id="playBtn">▶</button>
    <button class="pbtn" id="nextBtn">⏭</button>
  </div>
  <input type="range" id="seek" min="0" max="1000" value="0">
  <div class="times"><span id="tEl">0:00</span><span><button class="pbtn" id="back15">↺ 15</button> <button class="pbtn" id="fwd30">30 ↻</button> <button class="pbtn" id="speedBtn">1×</button></span><span id="tRem">-0:00</span></div>
  <div id="npDesc"></div>
</div>

<audio id="au" preload="metadata"></audio>

<script>

const LS = {pos:'mp_pos', played:'mp_played', added:'mp_added', speed:'mp_speed'};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let pos=load(LS.pos,{}), played=load(LS.played,{}), added=load(LS.added,[]);
let shows=JSON.parse(JSON.stringify(CATALOG));
added.forEach(a=>{
  let s=shows.find(x=>x.slug===a.slug);
  if(!s){s={name:a.show,slug:a.slug,cover:'icon-512.png',desc:'',episodes:[]};shows.push(s);}
  s.episodes.push({label:a.label||'',title:a.title,desc:a.desc||'',dur:0,src:a.src,custom:true});
});
const au=document.getElementById('au');
let cur=null, curList=null, curIdx=-1;
au.playbackRate=parseFloat(localStorage.getItem(LS.speed)||'1');
const fmt=s=>{s=Math.max(0,Math.round(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const eid=(s,e)=>s.slug+'|'+e.title;
function render(){
  const main=document.getElementById('shows'); main.innerHTML='';
  shows.forEach(s=>{
    const sec=document.createElement('section');
    const head=document.createElement('div'); head.className='showhead';
    head.innerHTML=`<img src="${s.cover}" alt=""><div><h2></h2><p></p></div>`;
    head.querySelector('h2').textContent=s.name; head.querySelector('p').textContent=s.desc||'';
    sec.appendChild(head);
    s.episodes.forEach((e,i)=>{
      const id=eid(s,e), p=pos[id]||0, pct=e.dur?Math.min(100,p/e.dur*100):0;
      const b=document.createElement('button'); b.className='ep'+(cur&&cur.id===id?' playing':'');
      b.innerHTML=`<span class="play">${cur&&cur.id===id&&!au.paused?'⏸':'▶'}</span><span class="meta"><span class="lab"></span><div class="ttl"></div><div class="dsc"></div>${p>4&&!played[id]?'<div class="bar"><i style="width:'+pct+'%"></i></div>':''}</span><span class="dur">${played[id]?'<span class="done">Played</span><br>':''}${e.dur?fmt(e.dur):''}</span>`;
      b.querySelector('.lab').textContent=e.label||''; b.querySelector('.ttl').textContent=e.title; b.querySelector('.dsc').textContent=e.desc||'';
      b.onclick=()=>play(s,e,i);
      sec.appendChild(b);
    });
    main.appendChild(sec);
  });
  const cont=Object.keys(pos).filter(id=>pos[id]>4&&!played[id]);
  const cw=document.getElementById('continueWrap'), cl=document.getElementById('continueList');
  if(cont.length){cw.style.display='block'; cl.innerHTML='';
    cont.slice(0,4).forEach(id=>{
      const [slug]=id.split('|'); const s=shows.find(x=>x.slug===slug); if(!s)return;
      const i=s.episodes.findIndex(e=>eid(s,e)===id); if(i<0)return; const e=s.episodes[i];
      const b=document.createElement('button'); b.className='ep';
      b.innerHTML=`<span class="play">▶</span><span class="meta"><span class="lab"></span><div class="ttl"></div><div class="dsc"></div></span><span class="dur">${fmt(e.dur-(pos[id]||0))} left</span>`;
      b.querySelector('.lab').textContent=s.name+' · '+(e.label||''); b.querySelector('.ttl').textContent=e.title; b.querySelector('.dsc').textContent='Pick up at '+fmt(pos[id]);
      b.onclick=()=>play(s,e,i); cl.appendChild(b);
    });
  } else cw.style.display='none';
}
function play(s,e,i){
  const id=eid(s,e);
  if(cur&&cur.id===id){au.paused?au.play():au.pause();render();return;}
  cur={id,show:s,ep:e}; curList=s.episodes; curIdx=i;
  au.src=e.src;
  const start=pos[id]||0;
  au.addEventListener('loadedmetadata',function h(){ if(start>4&&start<(au.duration||e.dur||start+1)-10) au.currentTime=start; au.removeEventListener('loadedmetadata',h); });
  document.getElementById('player').style.display='block';
  document.getElementById('pCover').src=s.cover;
  document.getElementById('pTitle').textContent=e.title;
  document.getElementById('pShow').textContent=s.name+(e.label?' · '+e.label:'');
  document.getElementById('npDesc').textContent=e.desc||''; document.getElementById('npDesc').style.display=e.desc?'block':'none';
  document.getElementById('speedBtn').textContent=au.playbackRate+'×';
  au.play();
  if('mediaSession' in navigator){
    navigator.mediaSession.metadata=new MediaMetadata({title:e.title,artist:s.name,album:'My Podcasts',artwork:[{src:s.cover,sizes:'512x512'}]});
    navigator.mediaSession.setActionHandler('previoustrack',()=>step(-1));
    navigator.mediaSession.setActionHandler('nexttrack',()=>step(1));
    navigator.mediaSession.setActionHandler('seekbackward',()=>au.currentTime=Math.max(0,au.currentTime-15));
    navigator.mediaSession.setActionHandler('seekforward',()=>au.currentTime=Math.min(au.duration||0,au.currentTime+30));
  }
  render();
}
function step(d){ if(!cur)return; const n=curIdx+d; if(n<0||n>=curList.length)return; play(cur.show,curList[n],n); }
document.getElementById('playBtn').onclick=()=>{ if(!cur)return; au.paused?au.play():au.pause(); };
document.getElementById('prevBtn').onclick=()=>step(-1);
document.getElementById('nextBtn').onclick=()=>step(1);
document.getElementById('back15').onclick=()=>au.currentTime=Math.max(0,au.currentTime-15);
document.getElementById('fwd30').onclick=()=>au.currentTime=Math.min(au.duration||0,au.currentTime+30);
const speeds=[0.75,1,1.25,1.5,2];
document.getElementById('speedBtn').onclick=()=>{ const i=speeds.indexOf(au.playbackRate); au.playbackRate=speeds[(i+1)%speeds.length]; localStorage.setItem(LS.speed,au.playbackRate); document.getElementById('speedBtn').textContent=au.playbackRate+'×'; };
const seek=document.getElementById('seek'); let seeking=false;
seek.addEventListener('input',()=>{seeking=true;});
seek.addEventListener('change',()=>{ if(au.duration) au.currentTime=seek.value/1000*au.duration; seeking=false; });
au.addEventListener('timeupdate',()=>{
  if(!cur)return; const d=au.duration||cur.ep.dur||0;
  if(!seeking&&d) seek.value=Math.round(au.currentTime/d*1000);
  document.getElementById('tEl').textContent=fmt(au.currentTime);
  document.getElementById('tRem').textContent='-'+fmt(d-au.currentTime);
  pos[cur.id]=au.currentTime; save(LS.pos,pos);
  if(d&&au.currentTime/d>0.92&&!played[cur.id]){played[cur.id]=1;save(LS.played,played);}
});
au.addEventListener('play',()=>{document.getElementById('playBtn').textContent='⏸';render();});
au.addEventListener('pause',()=>{document.getElementById('playBtn').textContent='▶';render();});
au.addEventListener('ended',()=>{ if(cur){played[cur.id]=1;save(LS.played,played); delete pos[cur.id]; save(LS.pos,pos);} step(1); render(); });
// Add screen
const addScreen=document.getElementById('addScreen'), mainEl=document.getElementById('shows');
function fillShows(){ const sel=document.getElementById('fShow'); sel.innerHTML=''; shows.forEach(s=>{const o=document.createElement('option');o.value=s.slug;o.textContent=s.name;sel.appendChild(o);}); const o=document.createElement('option');o.value='__new';o.textContent='New show…';sel.appendChild(o); }
document.getElementById('fShow').addEventListener('change',e=>{document.getElementById('newShowWrap').style.display=e.target.value==='__new'?'block':'none';});
document.getElementById('addBtn').onclick=()=>{fillShows();renderAdded();addScreen.style.display='block';mainEl.style.display='none';window.scrollTo(0,0);};
document.getElementById('addBack').onclick=()=>{addScreen.style.display='none';mainEl.style.display='block';render();};
function renderAdded(){ const w=document.getElementById('addedList'); w.innerHTML=added.length?'':'<div style="color:var(--dim);font-size:14px">Nothing added yet.</div>';
  added.forEach((a,i)=>{ const d=document.createElement('div'); d.className='addedItem'; d.innerHTML='<span></span>'; d.querySelector('span').textContent=a.show+' — '+a.title; const x=document.createElement('button'); x.textContent='Remove'; x.onclick=()=>{added.splice(i,1);save(LS.added,added);location.reload();}; d.appendChild(x); w.appendChild(d); }); }
document.getElementById('fGo').onclick=()=>{
  const sel=document.getElementById('fShow').value;
  const title=document.getElementById('fTitle').value.trim(), url=document.getElementById('fUrl').value.trim();
  if(!title||!url){alert('The episode needs a title and an audio link.');return;}
  let slug,name;
  if(sel==='__new'){ name=document.getElementById('fNewShow').value.trim(); if(!name){alert('Give the new show a name.');return;} slug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }
  else { const s=shows.find(x=>x.slug===sel); slug=s.slug; name=s.name; }
  added.push({show:name,slug,title,label:document.getElementById('fLabel').value.trim(),desc:document.getElementById('fDesc').value.trim(),src:url});
  save(LS.added,added); location.reload();
};
render();
</script>
